<!doctype html>
<html><head><meta charset="utf-8"><title>Battery chart options</title>
<style>
:root{--mod:rgba(255,255,255,.055);--panel:#232325;--t1:#f2f2f7;--t2:rgba(235,235,245,.62);--line:rgba(255,255,255,.10)}
.light{--panel:#ececee;--mod:rgba(0,0,0,.045);--t1:#1d1d1f;--t2:rgba(60,60,67,.80);--line:rgba(0,0,0,.10)}
body{margin:0;background:#0b0b0c;font-family:-apple-system,system-ui;padding:20px;display:grid;grid-template-columns:repeat(3,420px);gap:20px}
.cap{color:#aaa;font:600 13px -apple-system,system-ui;margin-bottom:6px}
.panel{background:var(--panel);padding:12px;border-radius:18px;margin-bottom:12px}
.m{background:var(--mod);border-radius:16px;padding:12px;color:var(--t1)}
.fig{font-weight:600;font-size:44px;line-height:1.1;font-variant-numeric:tabular-nums}
.st{font-size:13px;margin-top:2px}.sub{font-size:12px;color:var(--t2);margin-top:10px}
svg text{font:10px -apple-system,system-ui;fill:var(--t2)}
</style></head><body>
<script>
// 24 h of readings every 15 min: 6 PM yesterday .. now (6 PM)
const pts=[];for(let i=0;i<=96;i++){let h=i/4,v;
 if(h<5)v=70-h*2; else if(h<13)v=60-(h-5)*0.25; else if(h<15.08)v=58-(h-13)*8.2; else if(h<17.2)v=41+(h-15.08)*25.5; else v=95;
 if(i>=20&&i<=26)v=null; // a sleep gap with no readings
 pts.push(v==null?null:Math.min(95,v));}
const chargeFrom=15.08*4, W=372,H=96,PAD=0;
const x=i=>i/96*(W-34), y=v=>H-v/100*H;
function axis(){let s='';for(const [v,l] of [[100,'100%'],[50,'50%'],[0,'0%']])s+=`<line x1="0" x2="${W-34}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${W-28}" y="${y(v)+3.5}">${l}</text>`;
 ['6 PM','12 AM','6 AM','12 PM'].forEach((t,k)=>s+=`<text x="${x(k*24)}" y="${H+34}">${t}</text>`);s+=`<text x="${W-34}" y="${H+34}" text-anchor="end">Now</text>`;return s}
function strip(){return `<rect x="${x(chargeFrom)}" y="${H+6}" width="${x(96)-x(chargeFrom)}" height="3" rx="1.5" fill="var(--t1)" opacity=".45"/><text x="${x(chargeFrom)}" y="${H+18}">Charging</text>`}
function segs(){const out=[];let cur=[];pts.forEach((v,i)=>{if(v==null){if(cur.length)out.push(cur);cur=[]}else cur.push([x(i),y(v)])});if(cur.length)out.push(cur);return out}
function smooth(p){if(p.length<2)return '';let d=`M${p[0][0]},${p[0][1]}`;for(let i=0;i<p.length-1;i++){const p0=p[i-1]||p[i],p1=p[i],p2=p[i+1],p3=p[i+2]||p2;const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6],c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];d+=` C${c1},${c2},${p2}`}return d}
function optA(){let s=axis()+strip();for(const p of segs()){const d=smooth(p);s+=`<path d="${d} L${p[p.length-1][0]},${H} L${p[0][0]},${H} Z" fill="var(--t1)" opacity=".08"/><path d="${d}" fill="none" stroke="var(--t1)" stroke-width="2" stroke-linecap="round"/>`}
 const last=segs().pop().pop();s+=`<circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="var(--t1)"/>`;return s}
function optB(){let s=axis()+strip();const bw=(W-34)/24;for(let h=0;h<24;h++){const vs=pts.slice(h*4,h*4+4).filter(v=>v!=null);if(!vs.length)continue;const v=vs.reduce((a,b)=>a+b)/vs.length;
 s+=`<rect x="${h*bw+2}" y="${y(v)}" width="${bw-4}" height="${H-y(v)}" rx="3" fill="var(--t1)" opacity="${h*4>=chargeFrom?.55:.3}"/>`}return s}
function optC(){let s=`<line x1="0" x2="${W-34}" y1="${H}" y2="${H}" stroke="var(--line)"/><line x1="0" x2="${W-34}" y1="${y(100)}" y2="${y(100)}" stroke="var(--line)" stroke-dasharray="2 3"/><text x="${W-28}" y="${y(100)+3.5}">100%</text>`;
 ['6 PM','12 AM','6 AM','12 PM'].forEach((t,k)=>s+=`<text x="${x(k*24)}" y="${H+34}">${t}</text>`);s+=`<text x="${W-34}" y="${H+34}" text-anchor="end">Now</text>`+strip();
 for(const p of segs())s+=`<path d="${smooth(p)}" fill="none" stroke="var(--t1)" stroke-width="2.5" stroke-linecap="round"/>`;
 const lo=[x(Math.round(chargeFrom)),y(41)];s+=`<circle cx="${lo[0]}" cy="${lo[1]}" r="3" fill="var(--t1)"/><text x="${lo[0]+6}" y="${lo[1]+12}" style="fill:var(--t1)">41%</text>`;
 const last=segs().pop().pop();s+=`<circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="var(--t1)"/>`;return s}
const opts=[['A · Line with soft fill',optA],['B · Hourly bars',optB],['C · Line only, key points',optC]];
for(const [name,f] of opts){const col=document.createElement('div');col.innerHTML=`<div class="cap">${name}</div>`;
 for(const theme of ['','light'])col.innerHTML+=`<div class="panel ${theme}"><div class="m"><div class="fig">95%</div><div class="st">Charged to 95% Limit</div><div class="sub">Up from 41% at 9:05 AM</div>
 <svg width="${W}" height="${H+42}" viewBox="0 -6 ${W} ${H+48}" style="display:block;margin-top:10px;overflow:visible">${f()}</svg></div></div>`;
 document.body.appendChild(col)}
</script></body></html>
